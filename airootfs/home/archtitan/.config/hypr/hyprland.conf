# ArchTitan Default Hyprland Config

# Monitor setup
monitor=,preferred,auto,1

# Input
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = yes
        tap-to-click = true
    }
}

# Programs
$terminal = kitty
$menu = rofi -show drun
$browser = chromium
$filemanager = $terminal -e ranger

# Environment
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# Autostart
exec-once = bash -c 'sleep 2 && waybar'
exec-once = swaybg -i /usr/share/backgrounds/archtitan/wallpaper.png -m fill
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = xdg-user-dirs-update

# ── Live ISO idle/DPMS lockout ─────────────────────────────────────────────
# Three-layer approach to prevent DPMS/idle from killing the session:
#
# Layer 1: kill any idle daemon that may have been started as a dep
exec-once = bash -c 'if [ -d /run/archiso ]; then pkill -x hypridle; pkill -x swayidle; fi'
#
# Layer 2: systemd-inhibit holds a hard idle+sleep lock with logind
exec-once = bash -c 'if [ -d /run/archiso ]; then systemd-inhibit --what=idle:sleep:handle-lid-switch:handle-power-key --who=ArchTitanLiveISO --why="Calamares installer running" --mode=block sleep infinity & fi'
#
# Layer 3: tell Hyprland compositor directly — disable internal idle timer
# Wait for compositor to be ready first
exec-once = bash -c 'if [ -d /run/archiso ]; then sleep 3 && hyprctl dispatch dpms on; fi'

# Auto-launch installer as floating window (only on live ISO)
# Detection: /run/archiso directory only exists on mkarchiso live media
# Users can minimize it and explore the desktop, then reopen with Super+I
exec-once = bash -c 'sleep 6; if [ -d /run/archiso ]; then sudo -E calamares; fi'

# Keybindings (Matched to Host OS Cheat Sheet)
$mainMod = SUPER

# Shell & Utilities
bindr = SUPER, SUPER_L, exec, $menu            # Windows logo to open search
bind = $mainMod, Space, exec, $menu            # Spotlight-style: Super+Space
bind = $mainMod, Tab, exec, $menu              # Toggle overview/search
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy # Clipboard
bind = $mainMod, Period, exec, rofi -show emoji # Emoji
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy # Screen snip
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Session & Media
bind = CTRL ALT, Delete, exec, wlogout         # Toggle session menu
# Disable swaylock on live ISO so you don't get locked out without a password
bind = $mainMod, L, exec, : # Lock disabled on live OS
bind = $mainMod SHIFT, L, exec, systemctl suspend # Sleep

# Apps
bind = $mainMod, Return, exec, $terminal       # Terminal
bind = $mainMod, E, exec, $filemanager         # File manager
bind = $mainMod, W, exec, $browser             # Browser
bind = $mainMod, C, exec, code                 # Code editor
bind = $mainMod, X, exec, $terminal -e nano    # Text editor
bind = CTRL $mainMod, V, exec, pavucontrol     # Volume mixer
bind = CTRL SHIFT, Escape, exec, $terminal -e btop # Task manager
bind = $mainMod, I, exec, sudo -E calamares    # Settings/Installer (Kept as Calamares for ArchTitan live ISO)

# Window Management
bind = $mainMod, Q, killactive,                # Close
bind = $mainMod SHIFT ALT, Q, exec, hyprctl kill # Forcefully zap a window
bind = $mainMod ALT, Space, togglefloating,    # Float/Tile
bind = $mainMod, F, fullscreen, 0              # Fullscreen
bind = $mainMod, D, fullscreen, 1              # Maximize (fullscreen with gaps)
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit     # Adjust split ratio (toggle)

# Move Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move Window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Focus Workspace Left/Right
bind = CTRL $mainMod, left, workspace, e-1
bind = CTRL $mainMod, right, workspace, e+1
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# General appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(9ece6aee) rgba(e0af68ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
}

# Decoration — blur, shadows, rounding
decoration {
    rounding = 12

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        offset = 0, 4
        color = rgba(1a1a2ecc)
    }

    dim_inactive = false
    dim_strength = 0.1

    active_opacity = 1.0
    inactive_opacity = 0.92
}

# Animations — smooth and snappy
animations {
    enabled = yes

    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = snappy, 0.4, 0, 0.2, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, snappy
    animation = border, 1, 10, default
    animation = borderangle, 1, 30, default, loop
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 5, overshot, slidevert
}

# Layout
dwindle {
    preserve_split = yes
    force_split = 2
}

# Misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    # vfr was removed in Hyprland 0.55+ — no longer a valid option
}

# ── DPMS / Idle lockout — DISABLED for live installer ──────────────────────
# Hyprland will respect DPMS by default. On a live ISO we must explicitly
# suppress it so the installer session is never killed by inactivity.
# The 'decoration:screen_shader' and WLR DPMS path are both blocked below.
#
# Key settings:
#   • no hypridle / swayidle launched in exec-once above
#   • systemd-inhibit holds idle+sleep lock (see exec-once above)
#   • XF86Sleep / XF86ScreenSaver keys are swallowed
#   • dpms off is never issued automatically
bind = , XF86Sleep,        exec, :   # swallow sleep key
bind = , XF86ScreenSaver,  exec, :   # swallow screensaver key
bind = , XF86MonBrightnessDown, exec, :  # prevent QEMU ACPI dim events

# Window rules — float and center Calamares at a comfortable size
windowrule = float 1, match:class ^(calamares)$
windowrule = size 900 620, match:class ^(calamares)$
windowrule = center 1, match:class ^(calamares)$
windowrule = opacity 1.0, match:class ^(calamares)$
windowrule = suppressevent fullscreen maximize, match:class ^(calamares)$
windowrule = stayfocused 0, match:class ^(calamares)$
