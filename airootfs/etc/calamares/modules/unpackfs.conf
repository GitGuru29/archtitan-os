---
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        exclude:
            - "etc/calamares"
            - "etc/mkinitcpio.conf.d"
            - "etc/mkinitcpio.d/linux.preset"
            - "etc/systemd/system/etc-pacman.d-gnupg.mount"
            - "etc/systemd/system/getty@tty1.service.d/autologin.conf"
            - "etc/udev/rules.d/81-dhcpcd.rules"
            - "etc/skel/.config/gnupg"
            - "etc/systemd/system/choose-mirror.service"
            - "etc/systemd/system/pacman-init.service"
            - "etc/systemd/system/archtitan-liveuser.service"
            # Exclude live-only idle/sleep inhibitor — disable list not enough,
            # the service file itself must not land on the installed system.
            - "etc/systemd/system/archtitan-live-inhibit.service"
            - "etc/systemd/system/multi-user.target.wants/archtitan-live-inhibit.service"
            - "root"
            # Exclude live user's home directory from being copied over
            - "home/archtitan"
            # Exclude live-only SDDM autologin (would autologin as archtitan)
            - "etc/sddm.conf.d/autologin.conf"
            # Exclude live-only installer shortcut from installed OS
            - "usr/share/applications/install-archtitan.desktop"
