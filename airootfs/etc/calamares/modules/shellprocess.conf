---
# shellprocess — runs in the installed chroot before initcpio
# Creates /etc/mkinitcpio.d/linux.preset with standard default+fallback presets.
# The archiso-specific linux.preset is excluded from unpackfs (it has archiso
# hooks that don't exist on the installed system), so this script creates the
# correct preset file so mkinitcpio -p linux succeeds.

dontChroot: false
timeout: 30

script:
    - command: "/usr/local/bin/archtitan-initcpio-preset"
