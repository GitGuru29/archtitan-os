---
# shellprocess — runs in the installed chroot before initcpio
# 1. Removes the 'archtitan' live-session user from the installed system
# 2. Creates /etc/mkinitcpio.d/linux.preset with standard default+fallback presets.
# 3. Creates /etc/archtitan-postinstall/selections flag file so the
#    first-boot service knows which AUR/npm/pip packages to install.
# 4. Enables archtitan-postinstall@<username>.service for first boot.

dontChroot: false
timeout: 60

script:
    # Remove the live-session 'archtitan' user + its primary group from
    # the installed target. userdel -r would try to remove home but we
    # already excluded home/archtitan from unpackfs, so just clean passwd/shadow.
    - command: "userdel archtitan || true"
    - command: "groupdel archtitan || true"
    - command: "/usr/local/bin/archtitan-initcpio-preset"

    # Create the post-install selections directory
    - command: "mkdir -p /etc/archtitan-postinstall"

    # Write the selections file — Calamares global storage values
    # are substituted by the @@variable@@ syntax in shellprocess commands.
    # We use a heredoc written by a shell one-liner to keep it readable.
    # Each INSTALL_* flag matches a variable in archtitan-postinstall script.
    - command: >-
        bash -c '
        cat > /etc/archtitan-postinstall/selections << "EOF"
        # Generated by Calamares shellprocess — DO NOT EDIT
        # Controls archtitan-postinstall first-boot service
        INSTALL_AGY=false
        INSTALL_CLAUDE_CODE=false
        INSTALL_CODEX=false
        INSTALL_AIDER=false
        INSTALL_CONTINUE_DEV=false
        INSTALL_OLLAMA=false
        INSTALL_ANDROID_STUDIO=false
        INSTALL_FLUTTER=false
        INSTALL_HEROIC=false
        INSTALL_PROTON_GE=false
        INSTALL_GCLOUD=false
        INSTALL_AZURE_CLI=false
        INSTALL_BURPSUITE=false
        INSTALL_METASPLOIT=false
        INSTALL_PYTORCH=false
        INSTALL_TENSORFLOW=false
        INSTALL_HF_TRANSFORMERS=false
        INSTALL_SLACK=false
        INSTALL_ZOOM=false
        INSTALL_TEAMS=false
        INSTALL_FIGMA=false
        INSTALL_DAVINCI=false
        INSTALL_RUST_CROSS=false
        EOF
        chmod 644 /etc/archtitan-postinstall/selections
        '

    # Enable the first-boot service for the real user.
    # @@rootMountPoint@@ and user info are Calamares substitution vars.
    # We read the first non-system, non-root user from /etc/passwd.
    - command: >-
        bash -c '
        REAL_USER=$(awk -F: "$3 >= 1000 && $3 < 60000 { print $1; exit }" /etc/passwd)
        if [[ -n "$REAL_USER" ]]; then
            systemctl enable "archtitan-postinstall@${REAL_USER}.service" || true
            echo "[archtitan] Enabled postinstall service for user: $REAL_USER"
        fi
        '
