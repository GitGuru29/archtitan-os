---
# shellprocess — runs in the installed chroot before initcpio
# 1. Removes the 'archtitan' live-session user from the installed system
#    (it was copied from the squashfs — Calamares users module will create
#    the real user instead, so SDDM only shows one account)
# 2. Creates /etc/mkinitcpio.d/linux.preset with standard default+fallback presets.

dontChroot: false
timeout: 30

script:
    # Remove the live-session 'archtitan' user + its primary group from
    # the installed target. userdel -r would try to remove home but we
    # already excluded home/archtitan from unpackfs, so just clean passwd/shadow.
    - command: "userdel archtitan || true"
    - command: "groupdel archtitan || true"
    - command: "/usr/local/bin/archtitan-initcpio-preset"
