---
# ArchTitan OS — Calamares netinstall module
# Points to the local package groups YAML for the software chooser screen.

# Load groups from a local file (no internet needed to see the UI)
groupsUrl: file:///etc/calamares/modules/netinstall.yaml

# Packages are installed via pacman in the chroot after unpackfs.
# AUR/npm/pip packages are handled separately by archtitan-postinstall.service
# on the first real user login on the installed system.

# Label shown at the top of the chooser screen
label:
  sidebar: "Software"
  title: "Choose Your Software"

# Allow user to skip this page entirely
required: false
