---
# ArchTitan OS — Calamares packages module
# Installs packages selected via netinstall into the target chroot via pacman.
# Runs AFTER unpackfs and BEFORE shellprocess in the exec sequence.

backend: pacman

# pacman flags passed during installation
pacman_flags:
  - "--noconfirm"
  - "--noprogressbar"
  - "--needed"

# Do NOT fail the whole installation if a package is unavailable.
# This handles edge cases where a package name changed in upstream repos.
skip_missing: true

# operations block intentionally empty — netinstall populates this
# at runtime from the user's selections in the software chooser screen.
operations: []
