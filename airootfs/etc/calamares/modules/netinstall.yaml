---
# ArchTitan OS — Software Chooser Groups
# Displayed in Calamares during installation.
# Packages marked [pacman] are installed directly via pacman in chroot.
# Packages marked [first-boot] are installed on first user login via
# archtitan-postinstall.service (handles AUR, npm, pip installs).
#
# Format: https://github.com/calamares/calamares/blob/calamares/src/modules/netinstall/

# ─── AI Coding Assistants ──────────────────────────────────────────────────────
- name: "AI Coding Assistants"
  description: "AI-powered terminal coding agents and IDE integrations"
  selected: false
  critical: false
  packages: []           # AUR/npm — installed by archtitan-postinstall.service
  subgroups:

  - name: "Google Antigravity (AGY)"
    description: >-
      Google's AI coding agent. Installs 'agy' CLI — pair-programs with Gemini
      directly in your terminal. [First-boot via pip]
    selected: false
    packages: []         # pip install google-generativeai antigravity-sdk
    # flag written to /etc/archtitan-postinstall/selections for first-boot script

  - name: "Claude Code (Anthropic)"
    description: >-
      Anthropic's terminal AI coding agent. 'claude' command integrates with
      your editor and codebase. [First-boot via npm]
    selected: false
    packages: []         # npm install -g @anthropic-ai/claude-code

  - name: "Codex CLI (OpenAI)"
    description: >-
      OpenAI's terminal Codex coding agent. Reads your codebase and writes/edits
      code from natural language. [First-boot via npm]
    selected: false
    packages: []         # npm install -g @openai/codex

  - name: "Aider (AI Pair Programmer)"
    description: >-
      Open-source AI pair programming in your terminal. Works with GPT-4, Claude,
      Gemini, and local models. [First-boot via pip]
    selected: false
    packages: []         # pip install aider-chat

  - name: "Continue.dev (IDE Extension)"
    description: >-
      Open-source AI code assistant VSCode extension. Supports Ollama, Claude,
      Gemini, GPT-4, and any local model. [First-boot via code --install-extension]
    selected: false
    packages: []         # code --install-extension Continue.continue

  - name: "Ollama (Local LLM Runtime)"
    description: >-
      Run large language models locally — Llama 3, Mistral, Phi-3, Gemma.
      Works with Continue.dev and Aider. [pacman]
    selected: false
    packages:
      - ollama           # AUR → pre-built in Chaotic-AUR

# ─── Android Development ───────────────────────────────────────────────────────
- name: "Android Development"
  description: "Android SDK, tools, and Android Studio IDE"
  selected: false
  critical: false
  packages:
    - android-tools      # adb, fastboot, mkbootimg
    - android-udev       # udev rules for USB device access
    - jdk-openjdk        # Java runtime required by Android Studio / Gradle
    - gradle             # Android build system
  subgroups:

  - name: "Android Studio IDE"
    description: >-
      Google's official Android IDE with full emulator support.
      Installed via yay from AUR on first boot. [First-boot via AUR]
    selected: false
    packages: []         # yay -S android-studio

  - name: "Flutter & Dart SDK"
    description: >-
      Cross-platform mobile/desktop/web framework from Google.
      [First-boot via AUR: flutter]
    selected: false
    packages: []         # yay -S flutter

  - name: "Scrcpy (Android Screen Mirror)"
    description: >-
      Mirror and control Android devices over USB/TCP with zero latency. [pacman]
    selected: false
    packages:
      - scrcpy

