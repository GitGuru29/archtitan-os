---
# Configures the display manager on the installed system
# ArchTitan uses SDDM with Hyprland (Wayland session)

displaymanager: sddm

basicSetup: false

sessions:
    - id: hyprland
      name: Hyprland
      exec: /usr/bin/Hyprland
      tryExec: /usr/bin/Hyprland
      type: wayland

defaultSession: hyprland
