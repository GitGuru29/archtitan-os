# ArchTitan OS — Plymouth Quit Gate for Rise, Titan. First-Boot Animation
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# On first boot, plymouth-quit.service fires (triggered by multi-user.target)
# and force-quits Plymouth before the animation can play. This drop-in adds
# an ExecStartPre that waits for Plymouth to exit on its own first.

[Service]
ExecStartPre=/usr/local/bin/archtitan-wait-rise
