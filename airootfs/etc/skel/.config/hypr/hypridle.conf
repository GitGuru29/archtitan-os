# ArchTitan Live ISO — hypridle configuration
#
# NO timeouts are defined here. This file exists specifically to override
# any system-wide hypridle defaults that might fire during the live session.
#
# On the live ISO we NEVER want:
#   - screen blanking (DPMS off)
#   - swaylock / screen locker
#   - suspend / sleep
#
# If you ship a post-install config, add your timeouts AFTER install by
# replacing this file via Calamares postinstall or firstboot scripts.

general {
    # Do not lock on resume from suspend
    lock_cmd = :
    # Do not suspend at all
    before_sleep_cmd = :
    after_sleep_cmd = :
    # Ignore short idleness spikes (e.g. VM ACPI events)
    ignore_dbus_inhibit = false
}

# ── No timeout blocks ────────────────────────────────────────────────────────
# Intentionally empty — no blanking, no locking, no suspend while in live env.
